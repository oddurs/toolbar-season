<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive Internet Explorer 6 window from October 2005, buried in bundled toolbars.">
<title>Toolbar Season</title>
<link rel="stylesheet" href="css/style.css">

<div class="win" id="win">
  <div class="titlebar">
    <svg class="ie-ico" viewBox="0 0 16 16"><circle cx="8" cy="8.5" r="6" fill="#2a7de1"/><circle cx="8" cy="8.5" r="3.4" fill="#fff"/><rect x="4.6" y="8" width="7" height="1.6" fill="#2a7de1"/><path d="M1.5 12c2-6 9-11 13-9-1 2-5 7-12 10z" fill="none" stroke="#f5b800" stroke-width="1.3"/></svg>
    <span class="ttl" id="win-title">Microsoft Internet Explorer</span>
    <button class="cap" id="cap-min" aria-label="Minimize"><svg viewBox="0 0 11 11"><rect x="1.5" y="7.5" width="5" height="2" fill="#fff"/></svg></button>
    <button class="cap" id="cap-max" aria-label="Maximize"><svg viewBox="0 0 11 11"><rect x="1" y="1" width="9" height="9" fill="none" stroke="#fff"/><rect x="1" y="1" width="9" height="2.2" fill="#fff"/></svg></button>
    <button class="cap close" id="cap-close" aria-label="Close"><svg viewBox="0 0 11 11"><path d="m1.5 1.5 8 8m0-8-8 8" stroke="#fff" stroke-width="2"/></svg></button>
  </div>

  <div class="rebar" id="rebar">
    <div class="bars" id="bars"></div>
    <div class="throbber" id="throbber"><svg viewBox="0 0 30 26"><path d="M2 5c4-3 7-2 11 0l-2 8c-4-2-7-3-11 0z" fill="#e8421c"/><path d="M15 5c4 2 7 3 11 0l-2 8c-4 3-7 2-11 0z" fill="#3fae24"/><path d="M0 14c4-3 7-2 11 0l-2 8c-4-2-7-3-11 0z" fill="#2c7de1"/><path d="M13 14c4 2 7 3 11 0l-2 8c-4 3-7 2-11 0z" fill="#fcd12a"/></svg></div>
  </div>

  <div class="mid">
    <aside class="side" id="side" hidden>
      <div class="side-h"><span></span><button class="band-x" data-act="sidebar-close" aria-label="Close Explorer Bar">×</button></div>
      <div class="side-b"></div>
    </aside>
    <div class="pane">
      <div class="infobar" id="infobar" role="button" tabindex="0" hidden>
        <span id="ib-ico"></span><span id="ib-text"></span>
        <button class="ib-x" aria-label="Close Information Bar">×</button>
      </div>
      <div class="page" id="page"></div>
    </div>
  </div>

  <div class="bottombars" id="bottombars"></div>

  <div class="status" id="status">
    <div class="st-msg">
      <svg viewBox="0 0 16 16"><path d="M3 1h7l3 3v11H3z" fill="#fff" stroke="#6b7a8f"/><circle cx="8" cy="9" r="3.5" fill="#2a7de1"/></svg>
      <span id="st-msg">Done</span>
    </div>
    <div class="st-prog" id="st-prog"><i></i></div>
    <div class="st-view" id="st-view"></div>
    <div class="st-zone" id="st-zone"></div>
  </div>
</div>

<div class="era">October 2005 · Windows XP SP2 · Internet Explorer 6.0 · 14 toolbars and counting</div>

<script src="js/icons.js"></script>
<script src="js/toolbars.js"></script>
<script src="js/pages.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/app.js"></script>
<script src="js/events.js"></script>
